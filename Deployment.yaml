apiVersion: apps/v1
kind: Deployment
metadata:
  name: TODO-app
  labels:
    app: TODO
spec:
  replicas: 2
  selector:
    matchLabels:
      app: TODO
  template:
    metadata:
      labels:
        app: TODO
    spec:
      containers:
      - name: TODO-container
        image: zyadmohamed9/todo-app:latest  
        ports:
        - containerPort: 3000 
